<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketUA</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#eee;font:16px system-ui}main,header{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}b,strong{color:#bef264}button,input,select{font:inherit;min-height:44px;border:1px solid #444;border-radius:12px;padding:10px;background:#23252a;color:white}button{cursor:pointer}button:hover{border-color:#bef264}.hero{background:#bef264;color:#172008;padding:28px;border-radius:20px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}article{background:#202228;padding:14px;border-radius:16px} .pic{display:grid;place-items:center;height:130px;background:#30343b;border-radius:12px;font-size:48px}nav{display:flex;gap:8px;flex-wrap:wrap}small{color:#b5b7bd}dialog{background:#202228;color:white;border:1px solid #555;border-radius:16px;max-width:90vw}button.active{background:#bef264;color:#172008}</style><header><h2>Market<b>UA</b></h2><button id="login">Увійти</button></header><main><section class="hero"><small style="color:#283519">MARKETUA · PREVIEW</small><h1>Знайди своє. Продай зайве.</h1>Український майданчик оголошень</section><p><small>Демонстраційна версія. Товари вигадані, реальні угоди та збір персональних даних відсутні.</small></p><nav><button id="all" class="active">Каталог</button><button id="fav">Обране</button></nav><section class="filters"><input id="q" aria-label="Пошук товарів" placeholder="Що шукаєте?"><select id="cat" aria-label="Категорія"><option value="">Усі категорії</option><option>Електроніка</option><option>Дім</option><option>Спорт</option></select><select id="city" aria-label="Місто"><option value="">Уся Україна</option><option>Одеса</option><option>Київ</option><option>Львів</option></select><select id="sort" aria-label="Сортування"><option value="">За замовчуванням</option><option value="asc">Дешевші спочатку</option><option value="desc">Дорожчі спочатку</option></select></section><div class="grid" id="grid"></div></main><dialog id="modal"><div id="detail"></div><form method="dialog"><button>Закрити</button></form></dialog><script>const items=[{id:1,t:'Смартфон',p:12500,c:'Електроніка',l:'Одеса',i:'📱'},{id:2,t:'Навушники',p:2100,c:'Електроніка',l:'Київ',i:'🎧'},{id:3,t:'Велосипед',p:7800,c:'Спорт',l:'Львів',i:'🚲'},{id:4,t:'Настільна лампа',p:850,c:'Дім',l:'Одеса',i:'💡'}];const $=id=>document.getElementById(id);let favorites=new Set(),only=false;const money=p=>p.toLocaleString('uk-UA')+' ₴';function render(){let a=items.filter(x=>(!only||favorites.has(x.id))&&x.t.toLowerCase().includes($('q').value.toLowerCase())&&(!$('cat').value||x.c===$('cat').value)&&(!$('city').value||x.l===$('city').value));if($('sort').value)a.sort((x,y)=>($('sort').value==='asc'?1:-1)*(x.p-y.p));$('grid').innerHTML=a.map(x=>'<article><div class="pic">'+x.i+'</div><h3>'+x.t+'</h3><strong>'+money(x.p)+'</strong><p><small>'+x.l+'</small></p><button data-open="'+x.id+'">Деталі</button> <button aria-label="Обране" data-fav="'+x.id+'">'+(favorites.has(x.id)?'♥':'♡')+'</button></article>').join('')||'<p>Нічого не знайдено.</p>'}for(const id of ['q','cat','city','sort'])$(id).addEventListener('input',render);for(const id of ['all','fav'])$(id).onclick=()=>{only=id==='fav';$('all').classList.toggle('active',!only);$('fav').classList.toggle('active',only);render()};$('grid').onclick=e=>{if(e.target.dataset.fav){let id=Number(e.target.dataset.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);render()}if(e.target.dataset.open){let x=items.find(x=>x.id===Number(e.target.dataset.open));$('detail').textContent=x.t+' · '+money(x.p)+' · '+x.l+' · Демонстраційне оголошення';$('modal').showModal()}};$('login').onclick=()=>{$('detail').textContent='Вхід через Email і Telegram буде доступний після підключення сервера авторизації. У демоверсії дані не збираються.';$('modal').showModal()};render()</script></html>
