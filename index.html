<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketUA</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#eee;font:16px system-ui}main,header{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}b,strong{color:#bef264}button,input,select{font:inherit;min-height:44px;border:1px solid #444;border-radius:12px;padding:10px;background:#23252a;color:white}button{cursor:pointer}button:hover{border-color:#bef264}.hero{background:#bef264;color:#172008;padding:28px;border-radius:20px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}article{background:#202228;padding:14px;border-radius:16px} .pic{display:grid;place-items:center;height:130px;background:#30343b;border-radius:12px;font-size:48px}article img{width:100%;height:160px;object-fit:cover;border-radius:12px}dialog img{max-width:100%;max-height:45vh;object-fit:contain}textarea{background:#23252a;color:white;border-radius:8px;padding:10px;width:100%}dialog label{display:block;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap}small{color:#b5b7bd}dialog{background:#202228;color:white;border:1px solid #555;border-radius:16px;max-width:90vw}button.active{background:#bef264;color:#172008}</style><header><h2>Market<b>UA</b></h2><button id="login">Увійти</button></header><main><section class="hero"><small style="color:#283519">MARKETUA · BETA</small><h1>Знайди своє. Продай зайве.</h1>Український майданчик оголошень</section><p><small>Бета-версія. Не переказуйте кошти незнайомим продавцям.</small></p><nav><button id="all" class="active">Каталог</button><button id="fav">Обране</button><button id="add">Додати оголошення</button><button id="mine">Мої оголошення</button></nav><section class="filters"><input id="q" aria-label="Пошук товарів" placeholder="Що шукаєте?"><select id="cat" aria-label="Категорія"><option value="">Усі категорії</option></select><input id="city" aria-label="Місто" placeholder="Уся Україна"><select id="sort" aria-label="Сортування"><option value="">За замовчуванням</option><option value="asc">Дешевші спочатку</option><option value="desc">Дорожчі спочатку</option></select></section><p id="status" role="status"></p><div class="filters"><input id="min" type="number" min="0" placeholder="Ціна від" aria-label="Ціна від"><input id="max" type="number" min="0" placeholder="Ціна до" aria-label="Ціна до"><input id="regionfilter" placeholder="Область" aria-label="Область"></div><div class="grid" id="grid"></div></main><dialog id="modal"><div id="detail"></div><form method="dialog"><button>Закрити</button></form></dialog><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://fgshldwoamljsrcphmpn.supabase.co','sb_publishable_Rx6qVcluhKZzgfF62vyStQ_6hRf8J7P');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,items=[],cats=[],favorites=new Set(),mode='all';
function status(s){$('status').textContent=s}
function modal(h){$('detail').innerHTML=h;if(!$('modal').open)$('modal').showModal()}
function fail(e){status(e.message||String(e))}
async function load(){try{const c=await db.from('categories').select('*').order('name');if(c.error)throw c.error;cats=c.data;$('cat').innerHTML='<option value="">Усі категорії</option>'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');await refresh()}catch(e){fail(e)}}
async function refresh(){try{const s=await db.auth.getSession();user=s.data.session?.user||null;$('login').textContent=user?'Кабінет':'Увійти';const l=await db.from('listings').select('*').order('created_at',{ascending:false}).limit(200);if(l.error)throw l.error;items=l.data;favorites=new Set();if(user){const f=await db.from('favorites').select('listing_id').eq('user_id',user.id);if(f.error)throw f.error;favorites=new Set(f.data.map(x=>x.listing_id))}status('');render()}catch(e){fail(e)}}
function render(){let a=items.filter(x=>(mode==='mine'?user&&x.seller_id===user.id:x.active&&x.sale_status==='active'&&(mode!=='fav'||favorites.has(x.id)))&&x.title.toLowerCase().includes($('q').value.toLowerCase())&&(!$('cat').value||String(x.category_id)===$('cat').value)&&x.city.toLowerCase().includes($('city').value.toLowerCase())&&x.region.toLowerCase().includes($('regionfilter').value.toLowerCase())&&(!$('min').value||Number(x.price)>=Number($('min').value))&&(!$('max').value||Number(x.price)<=Number($('max').value)));if($('sort').value)a.sort((x,y)=>($('sort').value==='asc'?1:-1)*(x.price-y.price));$('grid').innerHTML=a.map(x=>'<article>'+ (x.photos?.length?'<img alt="Фото товару" loading="lazy" src="'+esc(photoURL(x.photos[0]))+'">':'<div class="pic">Без фото</div>')+'<h3>'+esc(x.title)+'</h3><strong>'+Number(x.price).toLocaleString('uk-UA')+' ₴</strong><p>'+esc(x.city)+' · '+(x.condition==='new'?'Новий':'Вживаний')+' · '+(x.negotiable?'Торг':'')+'</p><small>'+new Date(x.created_at).toLocaleDateString('uk-UA')+'</small><p>'+esc(x.sale_status==='sold'?'Продано':x.sale_status==='archived'?'Архів':'Активне')+'</p><button data-open="'+x.id+'">Деталі</button> <button data-fav="'+x.id+'" aria-label="Обране">'+(favorites.has(x.id)?'♥':'♡')+'</button></article>').join('')||'<p>Оголошень поки немає.</p>'}
function login(){if(user){modal('<h3>Особистий кабінет</h3><p>'+esc(user.email)+'</p><label>Ім’я <input id="display" maxlength="80"></label><button id="saveprofile">Зберегти ім’я</button><button id="logout">Вийти</button>');$('saveprofile').onclick=async()=>{const r=await db.from('profiles').upsert({id:user.id,display_name:$('display').value.trim()});if(r.error)fail(r.error);else{$('modal').close();status('Профіль збережено')}};$('logout').onclick=async()=>{await db.auth.signOut();$('modal').close();await refresh()};return}modal('<h3>Вхід / реєстрація</h3><form id="authform"><label>Email <input id="email" type="email" required></label><br><label>Пароль <input id="password" type="password" minlength="8" required></label><br><button>Увійти</button> <button type="submit" value="register">Реєстрація</button></form><p>Telegram: ще не підключено.</p><p id="authmsg" role="status"></p>');$('authform').onsubmit=async e=>{e.preventDefault();const credentials={email:$('email').value,password:$('password').value};const r=e.submitter?.value==='register'?await db.auth.signUp({...credentials,options:{emailRedirectTo:location.origin+location.pathname}}):await db.auth.signInWithPassword(credentials);$('authmsg').textContent=r.error?r.error.message:r.data.session?'Вхід виконано':'Перевірте пошту для підтвердження.';if(r.data.session){$('modal').close();await refresh()}}}
$('login').onclick=login;
const photoURL=p=>db.storage.from('market-photos').getPublicUrl(p).data.publicUrl;
const regions=['Вінницька','Волинська','Дніпропетровська','Донецька','Житомирська','Закарпатська','Запорізька','Івано-Франківська','Київська','Кіровоградська','Луганська','Львівська','Миколаївська','Одеська','Полтавська','Рівненська','Сумська','Тернопільська','Харківська','Херсонська','Хмельницька','Черкаська','Чернівецька','Чернігівська','АР Крим','Київ','Севастополь'];
function editor(x=null){if(!user)return login();modal('<h3>'+(x?'Редагувати':'Нове оголошення')+'</h3><form id="newform"><label>Назва <input id="title" required minlength="3" maxlength="120" value="'+esc(x?.title)+'"></label><label>Опис <textarea id="desc" required maxlength="5000">'+esc(x?.description)+'</textarea></label><label>Ціна ₴ <input id="price" type="number" min="0" max="9999999999" step=".01" required value="'+esc(x?.price)+'"></label><label>Область <select id="region">'+regions.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label><label>Населений пункт <input id="place" required maxlength="100" value="'+esc(x?.city)+'"></label><label>Категорія <select id="category">'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Підкатегорія <input id="subcat" maxlength="100" value="'+esc(x?.subcategory)+'"></label><label>Стан <select id="condition"><option value="used">Вживаний</option><option value="new">Новий</option></select></label><label><input id="neg" type="checkbox"> Можливий торг</label><label>Статус <select id="sale"><option value="active">Активне</option><option value="sold">Продано</option><option value="archived">Архів</option></select></label><label>Фото (до 10, до 5 МБ кожне) <input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><button>Зберегти</button><p id="newmsg" role="status"></p></form>');if(x){$('region').value=x.region||regions[0];$('category').value=x.category_id;$('condition').value=x.condition;$('neg').checked=x.negotiable;$('sale').value=x.sale_status}
$('newform').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;let uploaded=[];try{const files=[...$('photos').files],old=x?.photos||[];if(files.length+old.length>10)throw Error('Максимум 10 фото');for(const f of files){if(f.size>5242880||!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Неприпустимий файл');const path=user.id+'/'+crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type]);const u=await db.storage.from('market-photos').upload(path,f);if(u.error)throw u.error;uploaded.push(path)}const data={seller_id:user.id,title:$('title').value.trim(),description:$('desc').value,price:Number($('price').value),city:$('place').value.trim(),category_id:Number($('category').value),region:$('region').value,subcategory:$('subcat').value,condition:$('condition').value,negotiable:$('neg').checked,sale_status:$('sale').value,active:$('sale').value==='active',photos:[...old,...uploaded]};const r=x?await db.from('listings').update(data).eq('id',x.id):await db.from('listings').insert(data);if(r.error)throw r.error;uploaded=[];$('modal').close();mode='mine';await refresh()}catch(err){if(uploaded.length)await db.storage.from('market-photos').remove(uploaded);$('newmsg').textContent=err.message}finally{btn.disabled=false}}}
$('add').onclick=()=>editor();
for(const id of ['q','cat','city','sort','min','max','regionfilter'])$(id).oninput=render;for(const id of ['all','fav','mine'])$(id).onclick=()=>{mode=id;for(const k of ['all','fav','mine'])$(k).classList.toggle('active',k===id);render()};
$('grid').onclick=async e=>{try{const id=e.target.dataset.fav||e.target.dataset.open;if(!id)return;const x=items.find(x=>x.id===id);if(e.target.dataset.fav){if(!user)return login();const r=favorites.has(id)?await db.from('favorites').delete().eq('user_id',user.id).eq('listing_id',id):await db.from('favorites').insert({user_id:user.id,listing_id:id});if(r.error)throw r.error;await refresh()}else{await detail(x);if(false)modal('<h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><p>'+esc(x.city)+' · '+Number(x.price)+' ₴</p>'+(user?.id===x.seller_id?'<button id="remove">Видалити оголошення</button>':''));if(false&&$('remove'))$('remove').onclick=async()=>{if(!confirm('Видалити оголошення?'))return;const r=await db.from('listings').delete().eq('id',id);if(r.error)fail(r.error);else{$('modal').close();await refresh()}}}}catch(e){fail(e)}};
async function detail(x){const p=await db.from('profiles').select('display_name').eq('id',x.seller_id).maybeSingle();if(user)await db.from('listing_views').upsert({listing_id:x.id,user_id:user.id},{ignoreDuplicates:true});modal('<h3>'+esc(x.title)+'</h3>'+ (x.photos||[]).map(path=>'<a target="_blank" rel="noopener" href="'+esc(photoURL(path))+'"><img alt="Фото товару" src="'+esc(photoURL(path))+'"></a>').join('')+'<p>'+esc(x.description)+'</p><p>'+esc(x.region)+' · '+esc(x.city)+' · '+Number(x.price)+' ₴</p><p>Продавець: '+esc(p.data?.display_name||'Користувач MarketUA')+'</p><p>'+new Date(x.created_at).toLocaleDateString('uk-UA')+'</p><button id="share">Поділитися</button> <button id="report">Поскаржитися</button> '+(user?.id===x.seller_id?'<button id="edit">Редагувати</button> <button id="del">Видалити</button>':'')+'<p id="detailmsg" role="status"></p>');$('share').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('listing',x.id);try{if(navigator.share)await navigator.share({title:x.title,url:url.href});else await navigator.clipboard.writeText(url.href)}catch(e){$('detailmsg').textContent=e.message}};$('report').onclick=async()=>{if(!user)return login();const reason=prompt('Причина скарги');if(!reason)return;const r=await db.from('reports').insert({listing_id:x.id,user_id:user.id,reason});$('detailmsg').textContent=r.error?r.error.message:'Скаргу надіслано'};if($('edit'))$('edit').onclick=()=>editor(x);if($('del'))$('del').onclick=async()=>{if(!confirm('Видалити оголошення?'))return;const r=await db.from('listings').delete().eq('id',x.id);if(r.error)fail(r.error);else{$('modal').close();await refresh()}}}
db.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});load().then(async()=>{const id=new URLSearchParams(location.search).get('listing');if(id){const r=await db.from('listings').select('*').eq('id',id).maybeSingle();if(r.data)await detail(r.data)}});
</script></html>
