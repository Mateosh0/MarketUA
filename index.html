<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketUA</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#eee;font:16px system-ui}main,header{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}b,strong{color:#bef264}button,input,select{font:inherit;min-height:44px;border:1px solid #444;border-radius:12px;padding:10px;background:#23252a;color:white}button{cursor:pointer}button:hover{border-color:#bef264}.hero{background:#bef264;color:#172008;padding:28px;border-radius:20px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}article{background:#202228;padding:14px;border-radius:16px} .pic{display:grid;place-items:center;height:130px;background:#30343b;border-radius:12px;font-size:48px}nav{display:flex;gap:8px;flex-wrap:wrap}small{color:#b5b7bd}dialog{background:#202228;color:white;border:1px solid #555;border-radius:16px;max-width:90vw}button.active{background:#bef264;color:#172008}</style><header><h2>Market<b>UA</b></h2><button id="login">Увійти</button></header><main><section class="hero"><small style="color:#283519">MARKETUA · BETA</small><h1>Знайди своє. Продай зайве.</h1>Український майданчик оголошень</section><p><small>Бета-версія. Не переказуйте кошти незнайомим продавцям.</small></p><nav><button id="all" class="active">Каталог</button><button id="fav">Обране</button><button id="add">Додати оголошення</button><button id="mine">Мої оголошення</button></nav><section class="filters"><input id="q" aria-label="Пошук товарів" placeholder="Що шукаєте?"><select id="cat" aria-label="Категорія"><option value="">Усі категорії</option></select><input id="city" aria-label="Місто" placeholder="Уся Україна"><select id="sort" aria-label="Сортування"><option value="">За замовчуванням</option><option value="asc">Дешевші спочатку</option><option value="desc">Дорожчі спочатку</option></select></section><p id="status" role="status"></p><div class="grid" id="grid"></div></main><dialog id="modal"><div id="detail"></div><form method="dialog"><button>Закрити</button></form></dialog><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://fgshldwoamljsrcphmpn.supabase.co','sb_publishable_Rx6qVcluhKZzgfF62vyStQ_6hRf8J7P');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,items=[],cats=[],favorites=new Set(),mode='all';
function status(s){$('status').textContent=s}
function modal(h){$('detail').innerHTML=h;if(!$('modal').open)$('modal').showModal()}
function fail(e){status(e.message||String(e))}
async function load(){try{const c=await db.from('categories').select('*').order('name');if(c.error)throw c.error;cats=c.data;$('cat').innerHTML='<option value="">Усі категорії</option>'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');await refresh()}catch(e){fail(e)}}
async function refresh(){try{const s=await db.auth.getSession();user=s.data.session?.user||null;$('login').textContent=user?'Кабінет':'Увійти';const l=await db.from('listings').select('*').order('created_at',{ascending:false}).limit(200);if(l.error)throw l.error;items=l.data;favorites=new Set();if(user){const f=await db.from('favorites').select('listing_id').eq('user_id',user.id);if(f.error)throw f.error;favorites=new Set(f.data.map(x=>x.listing_id))}status('');render()}catch(e){fail(e)}}
function render(){let a=items.filter(x=>(mode==='mine'?user&&x.seller_id===user.id:x.active&&(mode!=='fav'||favorites.has(x.id)))&&x.title.toLowerCase().includes($('q').value.toLowerCase())&&(!$('cat').value||String(x.category_id)===$('cat').value)&&x.city.toLowerCase().includes($('city').value.toLowerCase()));if($('sort').value)a.sort((x,y)=>($('sort').value==='asc'?1:-1)*(x.price-y.price));$('grid').innerHTML=a.map(x=>'<article><div class="pic">MarketUA</div><h3>'+esc(x.title)+'</h3><strong>'+Number(x.price).toLocaleString('uk-UA')+' ₴</strong><p>'+esc(x.city)+'</p><button data-open="'+x.id+'">Деталі</button> <button data-fav="'+x.id+'" aria-label="Обране">'+(favorites.has(x.id)?'♥':'♡')+'</button></article>').join('')||'<p>Оголошень поки немає.</p>'}
function login(){if(user){modal('<h3>Особистий кабінет</h3><p>'+esc(user.email)+'</p><label>Ім’я <input id="display" maxlength="80"></label><button id="saveprofile">Зберегти ім’я</button><button id="logout">Вийти</button>');$('saveprofile').onclick=async()=>{const r=await db.from('profiles').upsert({id:user.id,display_name:$('display').value.trim()});if(r.error)fail(r.error);else{$('modal').close();status('Профіль збережено')}};$('logout').onclick=async()=>{await db.auth.signOut();$('modal').close();await refresh()};return}modal('<h3>Вхід / реєстрація</h3><form id="authform"><label>Email <input id="email" type="email" required></label><br><label>Пароль <input id="password" type="password" minlength="8" required></label><br><button>Увійти</button> <button type="submit" value="register">Реєстрація</button></form><p>Telegram: ще не підключено.</p><p id="authmsg" role="status"></p>');$('authform').onsubmit=async e=>{e.preventDefault();const credentials={email:$('email').value,password:$('password').value};const r=e.submitter?.value==='register'?await db.auth.signUp({...credentials,options:{emailRedirectTo:location.origin+location.pathname}}):await db.auth.signInWithPassword(credentials);$('authmsg').textContent=r.error?r.error.message:r.data.session?'Вхід виконано':'Перевірте пошту для підтвердження.';if(r.data.session){$('modal').close();await refresh()}}}
$('login').onclick=login;
$('add').onclick=()=>{if(!user)return login();modal('<h3>Нове оголошення</h3><form id="newform"><label>Назва <input id="title" required minlength="3" maxlength="120"></label><br><label>Опис <textarea id="desc" required maxlength="5000"></textarea></label><br><label>Ціна ₴ <input id="price" type="number" min="0" max="9999999999" step=".01" required></label><br><label>Місто <input id="place" required maxlength="100"></label><br><label>Категорія <select id="category">'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><br><button>Опублікувати</button><p id="newmsg" role="status"></p></form>');$('newform').onsubmit=async e=>{e.preventDefault();const r=await db.from('listings').insert({seller_id:user.id,title:$('title').value.trim(),description:$('desc').value,price:Number($('price').value),city:$('place').value.trim(),category_id:Number($('category').value)});if(r.error)$('newmsg').textContent=r.error.message;else{$('modal').close();mode='mine';await refresh()}}};
for(const id of ['q','cat','city','sort'])$(id).oninput=render;for(const id of ['all','fav','mine'])$(id).onclick=()=>{mode=id;for(const k of ['all','fav','mine'])$(k).classList.toggle('active',k===id);render()};
$('grid').onclick=async e=>{try{const id=e.target.dataset.fav||e.target.dataset.open;if(!id)return;const x=items.find(x=>x.id===id);if(e.target.dataset.fav){if(!user)return login();const r=favorites.has(id)?await db.from('favorites').delete().eq('user_id',user.id).eq('listing_id',id):await db.from('favorites').insert({user_id:user.id,listing_id:id});if(r.error)throw r.error;await refresh()}else{modal('<h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><p>'+esc(x.city)+' · '+Number(x.price)+' ₴</p>'+(user?.id===x.seller_id?'<button id="remove">Видалити оголошення</button>':''));if($('remove'))$('remove').onclick=async()=>{if(!confirm('Видалити оголошення?'))return;const r=await db.from('listings').delete().eq('id',id);if(r.error)fail(r.error);else{$('modal').close();await refresh()}}}}catch(e){fail(e)}};
db.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});load();
</script></html>
